questions:
  pit:
    - id: icebreaker
      label: Icebreakers (choose 2)
      questions:
        - id: icebreaker.1
          label: Whats your favorite part of your team?
          type: paragraph
        - id: icebreaker.2
          label: What's your favorite part of the robot?
          type: paragraph
        - id: icebreaker.3
          label: What are you excited for at this event?
          type: paragraph
        - id: icebreaker.4
          label: What's your role on the team?
          type: paragraph
        - id: icebreaker.5
          label: Any other icebreaker question
          type: paragraph
    - id: general
      label: General
      questions:
        - id: general.drivetrain
          label: What drivetrain are they using?
          type: select
          options:
            - Tank
            - West Coast
            - Mecanum
            - Omni
            - Swerve
            - Other
        - id: general.weight
          label: How heavy is their robot? (with bumpers & battery)
          type: short_text
        - id: general.preload
          label: How many fuel can they be preloaded with?
          type: integer
    - id: auto
      label: Autonomous
      questions:
        - id: auto.driveout
          label: Can they climb in auto?
          type: select
          options:
            - 'Yes'
            - 'No'
    - id: teleop
      label: TeleOP
      questions:
        - id: teleop.trench
          label: Can they traverse the trench?
          type: boolean
        - id: teleop.bump
          label: Can they traverse the bump?
          type: boolean
    - id: thoughts
      label: Thoughts
      questions:
        - id: thoughts.worry
          label: What about their robot are they most worried about?
          type: short_text
    - id: comments
      label: Comments
      questions:
        - id: comments.comments
          label: Any final comments?
          type: short_text
  match:
    - id: match_number
      label: 'Match #'
      type: integer
    - id: auto_climb
      label: Did they climb in auto?
      type: boolean
    - id: fuel
      label: How many fuel did they score?
      type: integer
    - id: teleop_climb
      label: Which rung did they climb to in teleop?
      type: select
      options:
        - None
        - 1
        - 2
        - 3
    - id: ranking_points
      label: Which RPs did they get?
      type: multiselect
      options:
        - Energized
        - Supercharged
        - Traversal
    - id: performance_label
      label: How well did they perform? Take us as roughly an 8.5
      type: label
    - id: performance
      type: slider
    - id: gameplayComments
      label: Do you have any final comments? Did you spot any potential weaknesses?
      type: short_text
